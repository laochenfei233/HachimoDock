name: Build installers

# 构建流水线：源码来自本仓库 ci-src release 的源码包（分支 main 的 git archive）。
# 审计版 FFmpeg/Node 运行时从官方 ai-maker-lab v0.1.245 安装包内抽取，并按源码
# prepare-desktop-resources.mjs 的审计表逐字节校验 SHA-256；校验不过就不产包。
#
# windows-x64 为真实出包任务；其余目标要么没有对应审计条目，要么公开安装包内的
# 运行时与审计表不一致，因此以探针方式运行：走真实流水线、保存门禁拒绝日志，
# 运行记录保持绿色但绝不产出未经审计的安装包。

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_SETUP_URL: https://github.com/ai-maker-lab/HachimoDock/releases/download/v0.1.245/HachimiDock_0.1.245_Windows-x64-setup.exe
  UPSTREAM_DMG_URL: https://github.com/ai-maker-lab/HachimoDock/releases/download/v0.1.245/HachimiDock_0.1.245_macOS-arm64.dmg
  AUDIT_FFMPEG_WIN_X64: 18ac8e4c695148f3e2e20b6a24b3974a7b350b3a6dee1c8a018db5c2d1b3fc4f
  AUDIT_FFMPEG_MAC_ARM64: ec8356f02a301258f9c4737ef3ab034259f4ff9031c905271e07892fa8bdf7c5
  AUDIT_FFMPEG_SOURCE: 99b393871f64a2d860587bcf0f9bdbf68b28693100b51c9dfdf3f37b604896a9

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Download and unpack source bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-src --repo ${{ github.repository }} --pattern "hachimodock-src-*.tar.gz" --output src.tar.gz
          New-Item -ItemType Directory -Force -Path src | Out-Null
          tar -xzf src.tar.gz -C src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        working-directory: src
        run: python pc/scripts/stage-release-firmware.py

      - name: Extract audited runtime from the official setup (silent install)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:UPSTREAM_SETUP_URL -OutFile setup.exe -MaximumRedirection 5
          Start-Process -Wait -FilePath .\setup.exe -ArgumentList '/S', '/D=C:\stage\app'
          $expect = @{
            'C:\stage\app\tools\ffmpeg.exe' = $env:AUDIT_FFMPEG_WIN_X64
            'C:\stage\app\tools\source\ffmpeg-8.1.3.tar.xz' = $env:AUDIT_FFMPEG_SOURCE
          }
          foreach ($path in $expect.Keys) {
            if (-not (Test-Path $path)) { throw "official installer did not contain $path" }
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
            if ($hash -ne $expect[$path]) { throw "audit hash mismatch for $path`: $hash" }
          }
          foreach ($name in 'tools\ffmpeg.LICENSE', 'tools\ffmpeg.README', 'tools\ffmpeg.SOURCE.txt', 'tools\zlib.LICENSE', 'bridge\runtime\node.exe') {
            if (-not (Test-Path "C:\stage\app\$name")) { throw "official installer did not contain $name" }
          }
          "PET_MANAGER_FFMPEG_BIN=C:\stage\app\tools\ffmpeg.exe" >> $env:GITHUB_ENV
          "PET_MANAGER_FFMPEG_README=C:\stage\app\tools\ffmpeg.README" >> $env:GITHUB_ENV
          "PET_MANAGER_FFMPEG_LICENSE=C:\stage\app\tools\ffmpeg.LICENSE" >> $env:GITHUB_ENV
          "PET_MANAGER_FFMPEG_SOURCE_ARCHIVE=C:\stage\app\tools\source\ffmpeg-8.1.3.tar.xz" >> $env:GITHUB_ENV
          "PET_MANAGER_ZLIB_LICENSE=C:\stage\app\tools\zlib.LICENSE" >> $env:GITHUB_ENV
          "PET_MANAGER_NODE_BIN=C:\stage\app\bridge\runtime\node.exe" >> $env:GITHUB_ENV
          "PET_MANAGER_TARGET_ARCH=x64" >> $env:GITHUB_ENV
          # prepare 阶段对 terrier-clips 调 PATH 上的 ffmpeg 做时长探测；
          # 追加语义必须走 GITHUB_PATH 文件（GITHUB_ENV 的 PATH 会整体替换 runner PATH）。
          "C:\stage\app\tools" >> $env:GITHUB_PATH

      - name: Restore audited bridge production dependencies (locked)
        working-directory: src/pc/src-tauri/bridge/packages/clawd-backend-service
        run: npm ci

      - name: npm ci (client)
        working-directory: src/pc
        run: npm ci

      - name: Prepare desktop resources (MSVC C2x for the WAMR checker)
        working-directory: src/pc
        env:
          # runner 的 MSVC 对 WAMR 空结构体报 C2016，且不认识任何 /std 选项；
          # CL 环境变量给每次 cl.exe 追加 /std:c20。只作用于 prepare 阶段，
          # 不让它泄漏进 Rust 的 cc 构建链。
          CL: /std:c20
        run: npm run prepare:desktop

      - name: Build (tauri build nsis,msi)
        working-directory: src/pc
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --ci

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src\pc\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe dist\
          Copy-Item src\pc\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi dist\

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installers
          path: dist/

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Download and unpack source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-src --repo "${{ github.repository }}" --pattern "hachimodock-src-*.tar.gz" --output src.tar.gz
          mkdir src
          tar -xzf src.tar.gz -C src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        working-directory: src
        run: python pc/scripts/stage-release-firmware.py

      - name: Probe the official dmg for an audited runtime
        id: probe
        run: |
          set -uo pipefail
          curl -L -o official.dmg "$UPSTREAM_DMG_URL"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/official official.dmg
          APP="$(find /Volumes/official -maxdepth 2 -name '*.app' | head -1)"
          RES="$APP/Contents/Resources"
          if [ ! -f "$RES/tools/ffmpeg" ]; then
            hdiutil detach /Volumes/official || true
            echo "official dmg did not contain tools/ffmpeg"
            exit 1
          fi
          ffmpeg_hash="$(shasum -a 256 "$RES/tools/ffmpeg" | cut -d' ' -f1)"
          source_hash="$(shasum -a 256 "$RES/tools/source/ffmpeg-8.1.3.tar.xz" | cut -d' ' -f1)"
          mkdir -p "$GITHUB_WORKSPACE/official-runtime"
          cp "$RES/tools/ffmpeg" "$RES/tools/ffmpeg.LICENSE" "$RES/tools/ffmpeg.README" \
             "$RES/tools/source/ffmpeg-8.1.3.tar.xz" "$RES/bridge/runtime/node" "$GITHUB_WORKSPACE/official-runtime/"
          hdiutil detach /Volumes/official || true
          if [ "$ffmpeg_hash" = "$AUDIT_FFMPEG_MAC_ARM64" ] && [ "$source_hash" = "$AUDIT_FFMPEG_SOURCE" ]; then
            echo "audited=true" >> "$GITHUB_OUTPUT"
            echo "runtime hashes match the audit table"
          else
            echo "audited=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Audited macOS runtime unavailable::官方 dmg 内 FFmpeg 为 ${ffmpeg_hash}，审计表要求 ${AUDIT_FFMPEG_MAC_ARM64}；本次不产出 macOS 安装包"
          fi
          {
            echo "PET_MANAGER_FFMPEG_BIN=$GITHUB_WORKSPACE/official-runtime/ffmpeg"
            echo "PET_MANAGER_FFMPEG_README=$GITHUB_WORKSPACE/official-runtime/ffmpeg.README"
            echo "PET_MANAGER_FFMPEG_LICENSE=$GITHUB_WORKSPACE/official-runtime/ffmpeg.LICENSE"
            echo "PET_MANAGER_FFMPEG_SOURCE_ARCHIVE=$GITHUB_WORKSPACE/official-runtime/ffmpeg-8.1.3.tar.xz"
            echo "PET_MANAGER_NODE_BIN=$GITHUB_WORKSPACE/official-runtime/node"
            echo "PET_MANAGER_TARGET_ARCH=arm64"
          } >> "$GITHUB_ENV"

      - name: npm ci
        working-directory: src/pc
        run: npm ci

      - name: Restore audited bridge production dependencies (locked)
        working-directory: src/pc/src-tauri/bridge/packages/clawd-backend-service
        run: npm ci

      - name: Build with the audited runtime
        if: steps.probe.outputs.audited == 'true'
        working-directory: src/pc
        run: npm run build:mac

      - name: Collect installers
        if: steps.probe.outputs.audited == 'true'
        run: |
          mkdir -p dist
          cp src/pc/src-tauri/target/release/bundle/dmg/*.dmg dist/

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.audited == 'true'
        with:
          name: macos-arm64-installer
          path: dist/

      # 审计不通过时仍走一次真实流水线，把门禁拒绝的原文存为证据；本步恒为成功。
      - name: Attempt build and capture the audit-gate refusal
        if: steps.probe.outputs.audited != 'true'
        working-directory: src/pc
        run: |
          set +e
          npm run build:mac 2>&1 | tee "$GITHUB_WORKSPACE/macos-arm64-attempt.log"
          code=${PIPESTATUS[0]}
          echo "prepare/build exit=$code (expected nonzero at the audit gate)"
          grep -m1 "不是已审计构建\|已审计 FFmpeg 二进制哈希" "$GITHUB_WORKSPACE/macos-arm64-attempt.log" || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.audited != 'true'
        with:
          name: macos-arm64-attempt-log
          path: macos-arm64-attempt.log

  macos-x64-probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download and unpack source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-src --repo "${{ github.repository }}" --pattern "hachimodock-src-*.tar.gz" --output src.tar.gz
          mkdir src
          tar -xzf src.tar.gz -C src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        working-directory: src
        run: python pc/scripts/stage-release-firmware.py

      - name: Extract the official arm64 runtime as the audit-gate input
        run: |
          set -euo pipefail
          curl -L -o official.dmg "$UPSTREAM_DMG_URL"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/official official.dmg
          APP="$(find /Volumes/official -maxdepth 2 -name '*.app' | head -1)"
          RES="$APP/Contents/Resources"
          mkdir -p audited
          cp "$RES/tools/ffmpeg" "$RES/tools/ffmpeg.LICENSE" "$RES/tools/ffmpeg.README" \
             "$RES/tools/source/ffmpeg-8.1.3.tar.xz" "$RES/bridge/runtime/node" audited/
          hdiutil detach /Volumes/official

      - name: npm ci (client)
        working-directory: src/pc
        run: npm ci

      # 公开运行时都是 arm64，x64 目标在 prepare 的架构校验处直接拒绝；
      # 审计表也没有 macos-x64 条目。日志即实证。
      - name: Attempt x64 build and capture the gate refusal
        working-directory: src/pc
        env:
          PET_MANAGER_TARGET_ARCH: x64
          CARGO_BUILD_TARGET: x86_64-apple-darwin
          PET_MANAGER_FFMPEG_BIN: ${{ github.workspace }}/audited/ffmpeg
          PET_MANAGER_FFMPEG_README: ${{ github.workspace }}/audited/ffmpeg.README
          PET_MANAGER_FFMPEG_LICENSE: ${{ github.workspace }}/audited/ffmpeg.LICENSE
          PET_MANAGER_FFMPEG_SOURCE_ARCHIVE: ${{ github.workspace }}/audited/ffmpeg-8.1.3.tar.xz
          PET_MANAGER_NODE_BIN: ${{ github.workspace }}/audited/node
        run: |
          set +e
          npm run build:mac 2>&1 | tee "$GITHUB_WORKSPACE/macos-x64-attempt.log"
          code=${PIPESTATUS[0]}
          echo "prepare/build exit=$code (expected nonzero at the gate)"
          grep -m1 "不是 macOS x64 可执行文件\|已审计 FFmpeg 二进制哈希" "$GITHUB_WORKSPACE/macos-x64-attempt.log" || true
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-attempt-log
          path: macos-x64-attempt.log

  windows-arm64-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download and unpack source bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ci-src --repo ${{ github.repository }} --pattern "hachimodock-src-*.tar.gz" --output src.tar.gz
          New-Item -ItemType Directory -Force -Path src | Out-Null
          tar -xzf src.tar.gz -C src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage firmware OTA inputs
        working-directory: src
        run: python pc/scripts/stage-release-firmware.py

      - name: Extract the official x64 runtime as the audit-gate input
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:UPSTREAM_SETUP_URL -OutFile setup.exe -MaximumRedirection 5
          Start-Process -Wait -FilePath .\setup.exe -ArgumentList '/S', '/D=C:\stage\app'
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\audited" | Out-Null
          Copy-Item C:\stage\app\tools\ffmpeg.exe "$env:GITHUB_WORKSPACE\audited\"
          Copy-Item C:\stage\app\tools\ffmpeg.LICENSE, C:\stage\app\tools\ffmpeg.README "$env:GITHUB_WORKSPACE\audited\"
          Copy-Item C:\stage\app\tools\source\ffmpeg-8.1.3.tar.xz, C:\stage\app\tools\zlib.LICENSE "$env:GITHUB_WORKSPACE\audited\"
          Copy-Item C:\stage\app\bridge\runtime\node.exe "$env:GITHUB_WORKSPACE\audited\"

      - name: npm ci (client)
        working-directory: src/pc
        run: npm ci

      # 打包器明确只支持 Windows x64，arm64 在 prepare 处直接拒绝——日志即实证。
      - name: Attempt arm64 build and capture the gate refusal
        shell: pwsh
        working-directory: src/pc
        env:
          PET_MANAGER_TARGET_ARCH: arm64
          CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
          PET_MANAGER_FFMPEG_BIN: ${{ github.workspace }}\audited\ffmpeg.exe
          PET_MANAGER_FFMPEG_README: ${{ github.workspace }}\audited\ffmpeg.README
          PET_MANAGER_FFMPEG_LICENSE: ${{ github.workspace }}\audited\ffmpeg.LICENSE
          PET_MANAGER_FFMPEG_SOURCE_ARCHIVE: ${{ github.workspace }}\audited\ffmpeg-8.1.3.tar.xz
          PET_MANAGER_ZLIB_LICENSE: ${{ github.workspace }}\audited\zlib.LICENSE
          PET_MANAGER_NODE_BIN: ${{ github.workspace }}\audited\node.exe
        run: |
          npm run build:win 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\windows-arm64-attempt.log"
          Write-Host "expected nonzero exit at the audit gate; exit=$LASTEXITCODE"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-attempt-log
          path: windows-arm64-attempt.log
